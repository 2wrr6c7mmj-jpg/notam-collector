name: Collect NOTAM and navigational warnings
run-name: collect-${{ github.event_name }}
on:
  schedule:
    # Target: every 2 h at JST odd hours :35 (UTC even hours). GitHub delays or
    # drops scheduled runs under load, so extra hourly slots exist; a run is
    # skipped when the last collection finished less than 100 minutes ago.
    - cron: '35 */2 * * *'
    - cron: '5 * * * *'
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      codes:
        description: 'Only these NOTAM codes (comma separated, blank = all)'
        required: false
      sources:
        description: 'Only these maritime source ids (comma separated, blank = all)'
        required: false
      seed_china_from_site:
        description: 'One-time: copy still-relevant Chinese warnings from the legacy Sites payload before collecting'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: notam-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Restore saved state from the data branch
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null; then
            git fetch --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" data
            git show FETCH_HEAD:state/notam.sqlite > state/notam.sqlite
            echo "Restored $(stat -c %s state/notam.sqlite) bytes of saved state."
            last=$(git show -s --format=%ct FETCH_HEAD)
            age=$(( ($(date +%s) - last) / 60 ))
            echo "Last collection finished ${age} minutes ago."
            if [ "${{ github.event_name }}" = schedule ] && [ "$age" -lt 100 ]; then
              echo "SKIP=1" >> "$GITHUB_ENV"
              echo "Skipping: a recent collection already covers this slot." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No data branch yet; starting with an empty store."
          fi
      - name: Run tests
        if: env.SKIP != '1'
        run: npm test
      - name: One-time backfill of Chinese warnings from Sites
        if: env.SKIP != '1' && inputs.seed_china_from_site
        run: node --no-warnings tools/seed-china-from-site.mjs --db state/notam.sqlite
      - name: Collect (failures keep the previous record)
        if: env.SKIP != '1'
        env:
          FAA_NMS_CLIENT_ID: ${{ secrets.FAA_NMS_CLIENT_ID }}
          FAA_NMS_CLIENT_SECRET: ${{ secrets.FAA_NMS_CLIENT_SECRET }}
          INPUT_CODES: ${{ inputs.codes }}
          INPUT_SOURCES: ${{ inputs.sources }}
        run: |
          set -- --db state/notam.sqlite --out public --deadline-minutes 45
          [ -n "$INPUT_CODES" ] && set -- "$@" --codes "$INPUT_CODES"
          [ -n "$INPUT_SOURCES" ] && set -- "$@" --sources "$INPUT_SOURCES"
          npm run collect -- "$@"
      - name: Publish state and public data to the data branch
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          work=$(mktemp -d)
          mkdir -p "$work/state" "$work/public"
          cp state/notam.sqlite "$work/state/"
          cp -r public/. "$work/public/"
          cat > "$work/README.md" <<'EOF'
          Generated by the collect workflow. Overwritten every run (single commit).
          Public JSON: public/api/nms.json, public/api/nav-warnings.json, public/api/update.json
          EOF
          cd "$work"
          git init -q -b data
          git config user.name "notam-collector"
          git config user.email "notam-collector@users.noreply.github.com"
          git add -A
          git commit -q -m "Collection $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "Published $(du -sh . | cut -f1) to the data branch."
      - name: Summary
        if: always()
        run: |
          [ -f public/collection-report.json ] && node -e '
            const r=JSON.parse(require("fs").readFileSync("public/collection-report.json","utf8"));
            const t=r.totals||{};
            console.log(`NOTAM ${t.notam} items (${t.notamErrors} code errors), maritime ${t.nav} items (${t.navErrors} source errors), ${Math.round((r.finishedAt-r.startedAt)/1000)}s`);
          ' | tee -a "$GITHUB_STEP_SUMMARY" || true
